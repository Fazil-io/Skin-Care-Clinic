<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" fill="none">
  <!-- Emblem Background -->
  <defs>
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49A89" />
      <stop offset="50%" stop-color="#C5897A" />
      <stop offset="100%" stop-color="#A56354" />
    </linearGradient>
    <linearGradient id="softGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4EFEB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer delicate ring -->
    <circle cx="30" cy="30" r="28" stroke="url(#roseGoldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
    <!-- Inner solid ring -->
    <circle cx="30" cy="30" r="24" fill="url(#softGlow)" stroke="url(#roseGoldGrad)" stroke-width="1.8" />
    
    <!-- Lotus / Glowing Skin Petal Motif -->
    <path d="M30 14 C30 22, 21 28, 21 34 C21 39, 25 43, 30 43 C35 43, 39 39, 39 34 C39 28, 30 22, 30 14 Z" fill="url(#roseGoldGrad)" />
    <!-- Center delicate spark / droplet -->
    <path d="M30 20 C27 25, 26 29, 26 33 C26 36, 28 38, 30 38 C32 38, 34 36, 34 33 C34 29, 33 25, 30 20 Z" fill="#FFFFFF" opacity="0.9" />
    <!-- Cross accent / aesthetic diamond at top -->
    <circle cx="30" cy="11" r="1.8" fill="url(#roseGoldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="82" y="32" font-family="'Cormorant Garamond', Georgia, serif" font-size="21" font-weight="700" fill="#121212" letter-spacing="0.5">
    Dr. L. Vijayalakshmi
  </text>
  <text x="82" y="49" font-family="'DM Sans', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#C5897A" letter-spacing="3.2">
    SKIN CARE CLINIC
  </text>
</svg>
